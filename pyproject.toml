[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jardik"
version = "0.1.0"
description = "Energy analysis and forecasting software: Dataset Manager, NILM and Forecasting in one modular monolith."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tzdata",
    "python-dotenv>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pypdf>=4.0",
]

[project.scripts]
jardik = "jardik.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
